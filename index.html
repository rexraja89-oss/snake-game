<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Snake FX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #0d0f18;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }
        header {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        .score-container {
            display: flex;
            gap: 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #a0a5c0;
            margin-top: 2px;
        }
        .score-container span {
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #141722;
            border: 2px solid #2a2e45;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 15, 24, 0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        .overlay h2 {
            font-size: 2rem;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(ff,0,85,0.5);
            margin-bottom: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;
            color: #000;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,255,204,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 15px;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(0,255,204,0.4);
        }
        /* Touch Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 300px;
            height: 130px;
            margin-top: 5px;
        }
        .touch-btn {
            background: #1e2235;
            border: 1px solid #3a3f58;
            border-radius: 10px;
            color: #00ffcc;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #121420;
        }
        .touch-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #121420;
            background: #252a42;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>CYBER SNAKE</h1>
        <div class="score-container">
            <div>SCORE: <span id="score">0</span></div>
            <div>HIGH: <span id="highscore">0</span></div>
        </div>
    </header>

    <div id="game-container">
        <canvas id="canvas" width="400" height="400"></canvas>
        
        <div id="ui-start" class="overlay">
            <h2 style="color:#00ffcc; text-shadow:0 0 10px #00ffcc;">READY?</h2>
            <p style="color: #a0a5c0; margin-bottom: 10px;">Swipe or use Buttons / Keys</p>
            <button class="btn" onclick="startGame()">PLAY</button>
        </div>

        <div id="ui-gameover" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p style="color:#fff; font-size:1.2rem;">Score: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">RESTART</button>
        </div>
    </div>

    <!-- D-Pad Controls for Touch -->
    <div class="controls">
        <div class="touch-btn btn-up" onclick="handleInput('UP')">▲</div>
        <div class="touch-btn btn-left" onclick="handleInput('LEFT')">
